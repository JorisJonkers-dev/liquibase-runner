# Tag -> image. release.yml pushes a vX.Y.Z tag through the App token; that push builds the
# multi-arch runner image and pushes it to GHCR, where the images lock resolves it to a digest.
#
# A manual run republishes a tag, and only a tag: it is dispatched on the tag itself, so the
# code that is built is the code the version names. A run on a branch does nothing.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

jobs:
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@618d5851b22d2c46d4234deaa07e0f1950e2b65d # v0.34.3
    with:
      image-name: liquibase-runner
      version: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
