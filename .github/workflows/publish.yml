# Tag -> image. release.yml pushes a vX.Y.Z tag through the App token; that push builds the
# multi-arch runner image and pushes it to GHCR, where the images lock resolves it to a digest.
#
# A manual run republishes a tag, and only a tag: it is dispatched on the tag itself, so the
# code that is built is the code the version names. A run on a branch does nothing.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

jobs:
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1 # v0.49.1
    with:
      image-name: liquibase-runner
      version: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64
      require-package-proxy: true
    permissions:
      contents: read
      packages: write
    secrets:
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}
